<div class="modal-header d-flex justify-content-between align-items-center">
  <h5 class="modal-title mb-0">File Preview</h5>

  <div class="d-flex align-items-center">
    <!-- Download icon (only if it's an image) -->
    <button 
      class="btn btn-link p-0 mr-2" 
        (click)="downloadFile(fileUrl, fileType, fileTitle)"
      title="Download">
      <i class="fa fa-download"></i>
    </button>

    <!-- Close button -->
    <button type="button" class="close" (click)="activeModal.dismiss()">&times;</button>
  </div>
</div>

<div class="modal-body text-center">
  <div *ngIf="isImage()" class="image-preview">
    <img [src]="fileUrl" alt="Image Preview" class="preview-img">
  </div>

  <div *ngIf="isPDF()" class="pdf-preview">
    <iframe [src]="fileUrl | safeUrl" width="100%" height="500px"></iframe>
  </div>

  <div *ngIf="!isImage() && !isPDF()" class="no-preview">
    <p>Preview not available for this file type.</p>
  </div>
</div>

<div class="modal-footer">
  <button class="btn btn-secondary" (click)="activeModal.dismiss()">Close</button>
</div>
