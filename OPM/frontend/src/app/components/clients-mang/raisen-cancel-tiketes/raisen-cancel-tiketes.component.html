<div class="modal-header">
    <h4 class="modal-title">{{title | translate}}</h4>
    <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss('Cross click')">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body">
    <form class="form" name="form" #f="ngForm" (ngSubmit)="this.Onsubmit(f)">
        <span></span>
        <div class="form-group">
            <label class="form-label"> {{'Description' | translate}} </label>
            <textarea class="form-control" [(ngModel)]="this.model.description" #description="ngModel"
                name="description" required></textarea>
            <div class="invalid-feedback" *ngIf="description.touched && description.errors?.required" class="error">
                  {{'Description required' | translate}}</div>
        </div>
        <div class="modal-footer">
            <button  type="submit" [disabled]="f.invalid"
                class="btn btn-outline-warning"> {{'Delete' | translate}}</button>
            <button type="button" class="btn btn-outline-dark"
                (click)="activeModal.close('Close click')"> {{'Close' | translate}}</button>
        </div>
    </form>
</div>
