<div class="modal-header">
    <h4 class="modal-title">{{ 'Solution Request' | translate }}</h4>
    <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss('Cross click')">
        <span aria-hidden="true">&times;</span>
    </button>
</div>

<div class="modal-body">
    <form name="form" #f="ngForm" (ngSubmit)="onSubmit(f)">
        <!-- Description Textarea -->
        <div class="mb-3">
            <label for="description" class="form-label">
                {{ 'Describe your request' | translate }}
            </label>
            <textarea [(ngModel)]="description" name="description" id="description" class="form-control" rows="4"
                placeholder="{{ 'Why?' | translate }}" required></textarea>
        </div>

        <!-- Modal Footer -->
        <div class="modal-footer">
            <button type="submit" class="btn btn-success" [disabled]="f.invalid">
                <i class="feather icon-check-circle mr-1"></i>
                {{ 'Submit' | translate }}
            </button>
            <button type="button" class="btn btn-outline-dark" (click)="activeModal.close('Close click')">
                {{ 'Close' | translate }}
            </button>
        </div>
    </form>
</div>
