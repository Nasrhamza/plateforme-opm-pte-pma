<div class="modal-header">
    <h4 class="modal-title">{{ title | translate }}</h4>
    <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss('Cross click')">
        <span aria-hidden="true">&times;</span>
    </button>
</div>

<div class="modal-body">
    <form name="form" #f="ngForm" (ngSubmit)="Onsubmit(f)">

        <!-- Case ID -->
        <div class="mb-3">
            <label for="caseId" class="form-label">{{ 'Enter Case ID' | translate }}</label>
            <div class="input-group">
                <span class="input-group-text bg-light">
                    <i class="feather icon-hash text-primary"></i>
                </span>
                <input type="text" class="form-control" id="caseId" [(ngModel)]="caseId" name="caseId"
                    placeholder="{{ 'Enter Case ID' | translate }}">
            </div>
        </div>

        <!-- File Upload -->
        <div class="mb-3">
            <label for="exchangeFile" class="form-label">{{ 'Upload File' | translate }}</label>
            <div class="input-group">
                <span class="input-group-text bg-light">
                    <i class="feather icon-upload-cloud text-primary"></i>
                </span>
                <input type="file" class="form-control" id="exchangeFile" (change)="onExchangeFileChange($event)"
                    accept=".eml,.msg">
            </div>
            <small class="form-text text-muted">
                <i class="feather icon-info mr-1"></i>{{ 'You can upload only one file (.eml, .msg)' | translate }}
            </small>
            <div *ngIf="fileError" class="text-danger small mt-1">
                <i class="feather icon-alert-triangle mr-1"></i>{{ 'Please upload a valid .eml file.' | translate }}
            </div>
        </div>

        <!-- Select Type -->
        <div class="mb-3">
            <label for="selectedType" class="form-label">{{ 'Select Type' | translate }}</label>
            <div class="input-group">
                <span class="input-group-text bg-light">
                    <i class="feather icon-layers text-primary"></i>
                </span>
                <select id="selectedType" class="form-control" [(ngModel)]="selectedType" name="selectedType">
                    <option [ngValue]="'soft'">{{ 'Soft' | translate }}</option>
                    <option [ngValue]="'hard'">{{ 'Hard' | translate }}</option>
                </select>
            </div>
        </div>

        <!-- Additional Fields for 'Hard' Type -->
        <ng-container *ngIf="selectedType === 'hard'">
            <div class="mb-3">
                <label for="supportMulti" class="form-label">{{ 'Select Support' | translate }}</label>
                <ng-select id="supportMulti" [items]="supportOptions" bindLabel="label" bindValue="value"
                    [(ngModel)]="support" name="support" [multiple]="true"
                    placeholder="{{ 'Choose support type(s)' | translate }}">
                </ng-select>
            </div>
            <!-- Equipment Name -->
            <div class="mb-3">
                <label for="equipmentName" class="form-label">{{ 'Equipment Name' | translate }}</label>
                <div class="input-group">
                    <span class="input-group-text bg-light">
                        <i class="feather icon-monitor text-primary"></i>
                    </span>
                    <input type="text" class="form-control" id="equipmentName" [(ngModel)]="equipmentName"
                        name="equipmentName" placeholder="{{ 'Enter Equipment Name' | translate }}" />
                </div>
            </div>

        </ng-container>


        <!-- Modal Footer -->
        <div class="modal-footer">
            <button *ngIf="!add" type="submit" [disabled]="f.invalid" class="btn btn-outline-warning">
                {{ 'Update' | translate }}
            </button>
            <button *ngIf="add" type="submit" [disabled]="f.invalid" class="btn btn-outline-primary">
                {{ 'Save' | translate }}
            </button>
            <button type="button" class="btn btn-outline-dark" (click)="activeModal.close('Close click')">
                {{ 'Close' | translate }}
            </button>
        </div>
    </form>
</div>
