<div class="auth-wrapper">
    <div class="auth-content container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg p-4" style="max-width: 500px; width: 100%; border-radius: 10px;">
            <div class="text-center mb-4 d-flex justify-content-center align-items-center gap-3">
                <img src="assets/logo/logoBlue.png" alt="Logo" class="img-fluid" width="120px">
            </div>
            <h5 class="text-center text-muted fw-bold mb-3">Reset Your Password</h5>
            <p class="text-center text-muted">Enter a new password to reset your account.</p>

            <form [formGroup]="form" (ngSubmit)="resetPassword()">
                <!-- New Password -->
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="feather icon-lock"></i></span>
                        <input type="password" formControlName="password" class="form-control"
                            placeholder="Enter new password">
                    </div>
                    <div *ngIf="form.get('password').errors && form.get('password').touched" class="text-danger mt-1">
                        * Password must be at least 6 characters.
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="feather icon-lock"></i></span>
                        <input type="password" formControlName="confirmPassword" class="form-control"
                            placeholder="Confirm new password">
                    </div>
                    <div *ngIf="form.hasError('mismatch')" class="text-danger mt-1">
                        * Passwords do not match.
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100 py-2" [disabled]="isSubmitting">
                    <span *ngIf="!isSubmitting">Reset Password</span>
                    <i *ngIf="isSubmitting" class="pi pi-spinner pi-spin"></i>
                </button>
            </form>

            <!-- Back to Login -->
            <p class="text-center text-muted mt-3">
                <a [routerLink]="['/auth/signin']" class="fw-bold text-primary">Back to Login</a>
            </p>
        </div>
    </div>
</div>
