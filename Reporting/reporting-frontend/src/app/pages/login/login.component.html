<div class="bg-surface min-h-screen flex items-center justify-center p-6">

  <!-- Login Container -->
  <div class="w-full max-w-[440px]">

    <!-- Branding -->
    <div class="flex flex-col items-center text-center mb-10">
      <div class="mb-6 w-16 h-16 editorial-gradient rounded-xl flex items-center justify-center text-white cloud-shadow">
        <span class="material-symbols-outlined text-4xl" style="font-variation-settings:'FILL' 1">analytics</span>
      </div>
      <h1 class="text-on-surface text-3xl font-extrabold tracking-tight mb-2">Reporting Hub</h1>
      <p class="text-on-surface-variant font-medium">Unified Analytics Platform</p>
    </div>

    <!-- Card -->
    <div class="bg-surface-container-lowest rounded-xl p-8 cloud-shadow relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-1 editorial-gradient"></div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-6">

        <!-- Error message -->
        @if (error()) {
          <div class="bg-error-container text-on-error-container text-sm font-medium px-4 py-3 rounded-lg flex items-center gap-2">
            <span class="material-symbols-outlined text-base">error</span>
            {{ error() }}
          </div>
        }

        <!-- Email -->
        <div class="space-y-2">
          <label class="block text-xs uppercase tracking-wider font-bold text-on-surface-variant px-1" for="email">
            Corporate Email
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-outline">mail</span>
            </div>
            <input
              id="email"
              type="email"
              name="email"
              [(ngModel)]="email"
              required
              placeholder="name@company.com"
              class="block w-full pl-10 pr-4 py-3 bg-surface-container-low border-0 rounded-lg text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container outline-none transition-all"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="space-y-2">
          <div class="flex justify-between items-center px-1">
            <label class="block text-xs uppercase tracking-wider font-bold text-on-surface-variant" for="password">
              Password
            </label>
            <a class="text-xs font-semibold text-primary hover:text-primary-container transition-colors" href="#">
              Forgot Access?
            </a>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-outline">lock</span>
            </div>
            <input
              id="password"
              type="password"
              name="password"
              [(ngModel)]="password"
              required
              placeholder="••••••••"
              class="block w-full pl-10 pr-4 py-3 bg-surface-container-low border-0 rounded-lg text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container outline-none transition-all"
            />
          </div>
        </div>

        <!-- Remember me -->
        <div class="flex items-center px-1">
          <input
            id="remember-me"
            type="checkbox"
            name="remember"
            [(ngModel)]="remember"
            class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded"
          />
          <label class="ml-2 block text-sm text-on-surface-variant font-medium" for="remember-me">
            Remember this session
          </label>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="loading()"
          class="w-full editorial-gradient text-white py-4 rounded-lg font-bold text-base shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
        >
          @if (loading()) {
            <span class="material-symbols-outlined animate-spin text-xl">progress_activity</span>
            Signing in...
          } @else {
            Sign In
            <span class="material-symbols-outlined">arrow_forward</span>
          }
        </button>

      </form>

      <!-- Footer icons -->
      <div class="mt-10 pt-6 border-t border-surface-container flex justify-between items-center">
        <div class="flex gap-4">
          <span class="material-symbols-outlined text-outline-variant text-xl">verified_user</span>
          <span class="material-symbols-outlined text-outline-variant text-xl">security</span>
          <span class="material-symbols-outlined text-outline-variant text-xl">vpn_lock</span>
        </div>
        <p class="text-[10px] font-bold text-outline uppercase tracking-widest">Secure SSO Enabled</p>
      </div>
    </div>

    <!-- Page footer -->
    <div class="mt-8 text-center">
      <p class="text-xs text-on-surface-variant leading-relaxed opacity-60">
        © 2025 Reporting Hub. All rights reserved.<br/>
        Proprietary &amp; Confidential Business Intelligence System.
      </p>
    </div>
  </div>

  <!-- Decorative blobs -->
  <div class="fixed top-0 right-0 -z-10 p-24 opacity-20 pointer-events-none">
    <div class="w-[500px] h-[500px] bg-primary-container/20 rounded-full blur-[120px]"></div>
  </div>
  <div class="fixed bottom-0 left-0 -z-10 p-24 opacity-20 pointer-events-none">
    <div class="w-[400px] h-[400px] bg-secondary-container/20 rounded-full blur-[100px]"></div>
  </div>
  <div class="fixed top-10 left-10 w-32 h-32 border border-outline-variant/10 rounded-3xl rotate-12 -z-10"></div>
  <div class="fixed bottom-20 right-20 w-48 h-48 border border-outline-variant/10 rounded-full -z-10"></div>

</div>
