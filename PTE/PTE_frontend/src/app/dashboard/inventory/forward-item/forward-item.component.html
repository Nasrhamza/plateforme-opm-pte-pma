<div class="modal-body">
    <form class="register-form" [formGroup]="forwardForm" (ngSubmit)="onSubmit(forwardForm)">
    <div class="row">
        <div  class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-4">
          <label>Forward {{payload.action}} to<span class="text-danger">*</span></label>
          <select  class="form-select form-control" formControlName="user" required>
            <option selected disabled>Please select user</option>
            <option  *ngFor="let user of users" [value]="user._id">{{user.firstName+" "+user.lastName}}</option>
          </select>
        </div>
    </div>
    <div class="row">
        <div class="input">
            <button type="submit" class="btn btn-primary" [disabled]="!forwardForm.valid">Send {{payload.action}}</button>
        </div>
    </div>
    </form>
</div>
