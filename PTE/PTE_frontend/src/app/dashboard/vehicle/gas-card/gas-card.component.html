<div class="modal-body">
    <!-- Total Gas Card Section -->
    <div class="row">
      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-4">
        <div class="gas-card">
          <!-- Card Header with Logo -->
          <div class="gas-card-header">
            <img src="/assets/images/total_logo.png" alt="Gas Card Logo" class="gas-card-logo">
          </div>
  
          <!-- Card Chip and Details -->
          <div class="row">
            <div class="col-xl-3 col-lg-3 col-md-3 col-sm-3 mb-4">
              <div class="gas-card-chip">
                <img src="/assets/images/cardShip.png" alt="Chip" class="chip-icon">
              </div>
            </div>
            <div class="col-xl-9 col-lg-9 col-md-9 col-sm-9 mb-4">
              <div class="gas-card-number">
                <h4>PROLOGIC TUNISIE</h4>
                <p class="car-model">{{payload.model}}</p>
                <p class="registration-number">{{payload.registration_number}}</p>
              </div>
            </div>
          </div>
  
          <!-- Card Balance and Card Number -->
          <div class="gas-card-details" *ngIf="card">
            <div class="gas-card-balance">
              <p><strong>Balance</strong></p>
              <p>{{card.balance}} DT</p>
            </div>
            <div class="gas-card-number-right">
              <p><strong>Card Number</strong></p>
              <p>{{card.card_number}}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  
    <!-- Link to Show/Hide Text Field -->
    <div class="text-center">
      <a (click)="toggleTextField()" class="show-text-field-link">
        {{showTextField ? 'Hide Text Field' : 'Add Consumption'}}
      </a>
    </div>
  
    <div *ngIf="showTextField" class="mt-3 text-center">
        <div class="input-with-unit">
          <input
            type="number"
            class="form-control modern-input"
            [(ngModel)]="amount"
            (input)="validateAmount()"
            [placeholder]="'Enter amount (0 - ' + (payload.type === 'commercial' ? 350 : 200) + ')'"
            min="0"
            [max]="payload.type === 'commercial' ? 350 : 200"
          />
          <span class="unit">DT</span>
          <button class="btn btn-primary send-button" (click)="sendAmount()">Send</button>
        </div>
        <small *ngIf="amountError" class="text-danger">{{amountError}}</small>
      </div>
  </div>
