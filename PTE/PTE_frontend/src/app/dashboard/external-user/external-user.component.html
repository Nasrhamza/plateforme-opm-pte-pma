<section class="main-content">
    <ul class="breadcrumb breadcrumb-style ">
        <li class="breadcrumb-item">
            <h5 class="page-title m-b-0">External User</h5>
        </li>
        <li class="breadcrumb-item bcrumb-1">
            <a routerLink="/dashboard/main">
                <i class="fas fa-home font-17"></i></a>
        </li>
        <li class="breadcrumb-item">External User list</li>
    </ul>
    <div class="section-body">
        <div class="row">
            <div class="col-12 col-md-12 col-lg-12">
                <div class="card">
                        <div class="row">
                            <div class="card-header">
                                <div class="col-10">
                                    <h4>External list</h4>
                                </div>
                                <div class="col-2" *ngIf="userRole==='ASSISTANT'">
                                <button class="btn btn-outline-primary" (click)="addExternalModal()"><i class="fas fa-user-plus"></i> Add External </button> 
                                </div>
                            </div>
                        </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-sm-12">
                                <div class="form-group row">
                                    <div class="col-sm-4">
                                        <div class="d-flex">
                                            <label class="col-form-label msr-3">Search:</label>
                                            <input type="text" placeholder="Filter table" class="form-control"
                                                (keyup)='updateFilter($event)'>
                                        </div>
                                    </div>
                                </div>
                                <ngx-datatable #table class="material" [rows]="rows"  [sortType]="SortType.multi"
                                    [loadingIndicator]="loadingIndicator" columnMode="force" [headerHeight]="50"
                                    [footerHeight]="50" rowHeight="auto" [limit]="6" [scrollbarH]="scrollBarHorizontal"
                                    [reorderable]="reorderable">
                                    <ngx-datatable-column [width]="300" name="Name">
                                        <ng-template let-row="row" let-value="value" let-i="index" ngx-datatable-cell-template>
                                            <img  src="{{ picsUrl+row.image }}" class="data-table-img" />
                                            <div class="name-col-style">
                                                <div>{{row.firstName+" "+row.lastName}}</div>
                                                <div class="font-12 text-muted">{{row.roles}}</div>
                                            </div>
                                        </ng-template>
                                    </ngx-datatable-column>
                                    <ngx-datatable-column [width]="150" name="Status">
                                        <ng-template let-row="row" ngx-datatable-cell-template>
                                            <div *ngIf="row.external" class="badge-outline col-green">External</div>
                                        </ng-template>
                                    </ngx-datatable-column>
                                    <ngx-datatable-column name="Departement">
                                        <ng-template let-row="row" ngx-datatable-cell-template>
                                            {{row.departement}}
                                        </ng-template>
                                    </ngx-datatable-column>
                                    <ngx-datatable-column name="Actions" [sortable]="false">
                                        <ng-template let-value="value" let-row="row" let-rowIndex="rowIndex"
                                            ngx-datatable-cell-template>
                                            
                                            <button type="button" class="btn btn-outline-primary" style="border: none;" *ngIf="row.external_docs.length>0" (click)="downloadCV(row)"
                                                    ngbPopover="Download external's documents"
                                                    triggers="mouseenter:mouseleave"
                                                    placement="left">  
                                                <i class="far fa-file-pdf" ></i>
                                            </button>
                                            <button type="button" class="btn btn-outline-danger" style="border: none;" *ngIf="row.external_docs.length==0" routerLink="/dashboard/user-profile/{{row._id}}"
                                                    ngbPopover="Go to profile"
                                                    triggers="mouseenter:mouseleave"
                                                    placement="left">
                                                <i class="fas fa-arrow-right" ></i>
                                            </button>
                                            <!-- <button  type="button" class="btn btn-outline-danger" style="border: none;" (click)="deleteExternal(row._id)"
                                                    ngbPopover="Delete user"
                                                    triggers="mouseenter:mouseleave"
                                                    placement="left">
                                                <i class="far fa-trash-alt" ></i>
                                            </button> -->
                                        </ng-template>
                                    </ngx-datatable-column>
                                </ngx-datatable>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
