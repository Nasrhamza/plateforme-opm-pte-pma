<div class="modal-header editRowModal">
    <h4 class="modal-title" id="modal-basic-title">
      <div class="table-modal-header">
        <div class="modal-about">
          <div class="fw-bold p-t-10 font-17">
            Add Post 
          </div>
        </div>
      </div>
    </h4>
    <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <form class="register-form" [formGroup]="postForm"  (ngSubmit)="onSubmit(postForm)" >
        <div class="row">
          <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-4">
              <label>Description</label>
              <textarea class="form-control" placeholder="Put your Description here..." formControlName="description"></textarea>            
              <small class="form-text text-danger"
                  *ngIf="!postForm.get('description')?.valid && postForm.get('description')?.touched"> Description
                  is required
              </small>
          </div>
        </div>
        <label class="custom-switch mt-2">
          <input type="checkbox" formControlName="switch" class="custom-switch-input">
          <span class="custom-switch-indicator"></span>
          <span class="custom-switch-description">Add attachement</span>
        </label>
        <div class="row" *ngIf="postForm.get('switch')!.value">
            <div class="col-md-12">
                <!-- <label>Add attachement<i class=""></i></label> -->
                <ngx-dropzone [multiple]="true" (change)="onSelect($event)">
                    <ngx-dropzone-label>You can click or drag & drop here!</ngx-dropzone-label>
                    <ngx-dropzone-preview *ngFor="let f of images" [removable]="true" (removed)="onRemove(f)">
                        <ngx-dropzone-label>{{ f.name }}</ngx-dropzone-label>
                    </ngx-dropzone-preview>
                </ngx-dropzone>
                <!-- <input type="file" class="form-control" #image formControlName="image" multiple="false"/> -->
            </div>
        </div>
        
        <div class="modal-footer">
          <button  type="submit" class="btn btn-primary" [disabled]="!postForm.valid">Submit</button>
          
          <button type="button" class="btn btn-light" (click)="activeModal.close('Close click')">Close</button>
        </div>
      </form>
