<!DOCTYPE html>
<html>
<head>
    <style>
        .wrapper{
            margin: 0;
            padding: 0;
            padding: 30px;
            background-color: #f3f5f6;
        }
        .container {
            margin: 0 auto;
            font-family: Arial, sans-serif;
            background-color: #fff;
            border-radius: 8px;
            max-width: 800px;
        }
        .header {
            background-color: #fff;
            color: white;
            padding: 40px;
            background-size: cover;
            border-bottom: 1px solid rgb(231, 231, 231);
            background-position: right;

        }
        .content {
            text-align: left;
            padding: 20px 40px;
        }
        .footer {
            padding: 20px;
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            padding: 20px;
        }
        .text-bold{
            font-weight: bolder;
        }
    </style>
</head>
<body style="padding: 0;margin: 0;">
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <img src="https://pma.prologic.com.tn:3100/assets/images/pma_logo.png" alt="PMA logo">
            </div>
            <div class="content">
                <p>Hello, {{name}}</p>
                <p>The file shared below is from the project : <br><span class="text-bold">{{ projectName }}</span></p>
                <p>Download it <a href="https://pma-backend.prologic.com.tn:3002/download/{{encodeURIComponent fileName}}">here</a></p>
            </div>
            <div class="footer">
                <p>&copy; {{year}} PMA - Prologic</p>
            </div>
        </div>
    </div>
</body>
</html>
