<!DOCTYPE html>
<html>
<head>
    <style>
        .wrapper{
            margin: 0;
            padding: 0;
            padding: 30px;
            background-color: #f3f5f6;
        }
        .container {
            margin: 0 auto;
            font-family: Arial, sans-serif;
            background-color: #fff;
            border-radius: 8px;
            max-width: 800px;
        }
        .header {
            background-color: #fff;
            color: white;
            padding: 40px;
            background-size: cover;
            border-bottom: 1px solid rgb(231, 231, 231);
            background-position: right;

        }
        .content {
            text-align: left;
            padding: 20px 40px;
        }
        .footer {
            padding: 20px;
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            padding: 20px;
        }
        .text-bold{
            font-weight: bolder;
        }
    </style>
</head>
<body style="padding: 0;margin: 0;">
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <img src="https://pma.prologic.com.tn:3100/assets/images/pma_logo.png" alt="PMA logo">
            </div>
            <div class="content">
                <p>Hi, {{name}} !</p>
                <p>A New Project has been created, and you it's <span class="text-bold">Team Leader</span>, the new project intitled : <br></p>
                <p class="text-bold">{{ projectName }}</p>
                <p>Feel free to manage your tasks and track your progress on : <span class="text-bold">PMA</span></p>
            </div>
            <div class="footer">
                <p>&copy; {{year}} PMA - Prologic</p>
            </div>
        </div>
    </div>
</body>
</html>
