<h5 mat-dialog-title class="mat-subtitle-1">{{ 'Share file' | translate }}
</h5>

<mat-dialog-content style="min-width: 700px;min-height: 300px;">
    <form class="m-t-30">
        <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">{{ 'User email' | translate }}</mat-label>
        <mat-form-field appearance="outline" class="w-100" color="primary">
            <input matInput [formControl]="email"/>
        </mat-form-field>
        <div style="position: relative;">
            @if(suggestedUsers){
                <ul class="suggestion cardWithShadow">
                    @for(user of suggestedUsers;track user._id){
                        <li class="suggest-item" (click)="handleUserSelect(user.email)"> 
                            <i-tabler name="mail"></i-tabler>
                            <span>{{ user.email }} </span>
                        </li>
                    }
                </ul>
            }
        </div>
        <button mat-flat-button color="primary" class="w-100" [disabled]="!email.valid || loading" (click)="submit()">
            {{ 'Submit' | translate }}
        </button>
    </form>
</mat-dialog-content>
