@for(team of teams;track team.project?._id){
    <mat-card class="cardWithShadow" style="cursor: pointer;">
        <mat-card-content>
            <div class="d-flex align-items-start m-t-24 m-b-24">
                <button mat-mini-fab class="bg-light-primary shadow-none rounded icon-48">
                    <i-tabler name="flag" class="icon-20 d-flex text-primary"></i-tabler>
                </button>
                <div class="m-l-16 w-100">
                    <span class="f-s-14">
                        {{ 'Project' | translate }}
                    </span>
                    <h5 class="f-s-16 f-w-600 m-0 m-b-4" (click)="router.navigate(['engineer', 'projects', team?.project?._id])" >{{ team?.project?.Projectname }}</h5>
                    <div>
                        <span class="f-s-14">
                            {{ 'Members' | translate }}
                        </span>
                    </div>
                    <div class="d-flex align-items-center m-t-10">
                        <div class="d-flex align-items-center social-chips">
                            @for(user of team?.team; track user._id){
                               <img
                               (click)="showUserDetails(user._id)"
                               src="{{imagesUrl}}/{{user?.image}}"
                               width="40"
                               height="40"
                               alt="social"
                               class="rounded-circle"
                               matTooltip="{{user?.fullName}}"
                             />
                            }
                        </div>
                      </div>
                </div>
            </div>
        </mat-card-content>
    </mat-card>
    <!-- <mat-divider></mat-divider> -->
}
