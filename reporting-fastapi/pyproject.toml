[project]
name = "reporting-fastapi"
version = "0.1.0"
description = "FastAPI aggregation layer for OPM, PTE, PMA reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pymongo>=4.8.0",
  "pydantic-settings>=2.5.0",
  "apscheduler>=3.10.4",
  "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
